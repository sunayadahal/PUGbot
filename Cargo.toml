[package]
name = "pugbot"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Discord bot for organizing pickup games (PUGs), one queue per enabled channel"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
# Compiles the debug-only maintenance tooling (`pugbot --mode debug debug-reset`).
# Production builds must not enable this: the command cannot exist in a binary
# built without it.
debug-tools = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dependencies.serenity]
version = "0.12"
default-features = false
features = ["builder", "cache", "client", "collector", "gateway", "http", "model", "rustls_backend", "utils"]

[dependencies.sqlx]
version = "0.8"
default-features = false
features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate", "chrono", "uuid", "json"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
